name: "🐛 Bug report"
description: Report a bug to help us improve the module.
type: Bug
labels: ["triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before reporting a bug, please make sure that you have read through our [documentation](https://strapi.nuxtjs.org) and existing [issues](https://github.com/nuxt-modules/strapi/issues?q=is%3Aissue%20is%3Aopen%20sort%3Aupdated-desc).
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: You can use `npx nuxt info` to fill this section
      placeholder: |
        - Operating System: `Darwin`
        - Node Version:     `v24.6.0`
        - Nuxt Version:     `4.0.3`
        - CLI Version:      `3.27.0`
        - Nitro Version:    `2.12.4`
        - Package Manager:  `pnpm@10.15.0`
        - Builder:          `-`
        - User Config:      `-`
        - Runtime Modules:  `-`
        - Build Modules:    `-`
    validations:
      required: true
  - type: dropdown
    id: strapi
    attributes:
      label: Strapi
      options:
        - v5
        - v4
        - v3
      default: 0
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v2.2.0
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Please provide a link to a repository that reproduces the bug. A minimal [reproduction is required](https://antfu.me/posts/why-reproductions-are-required) unless you are absolutely sure that the issue is obvious and the provided information is enough to understand the problem. If a report is vague (e.g. just a generic error message) and has no reproduction, it will receive a "needs reproduction" label.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is. If you intend to submit a PR for this issue, tell us in the description.
    validations:
      required: true
  - type: textarea
    id: additonal
    attributes:
      label: Additional context
      description: If applicable, add any other context or screenshots here.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Optional if provided reproduction. Please try not to insert an image but copy paste the log text.
      render: shell-script
